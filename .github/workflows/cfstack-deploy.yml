name: cfstack-deploy

on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  deploy:
    concurrency: release
    runs-on: 'ubuntu-latest'
    if: github.run_attempt == 1
    steps:
      - name: Generate github token
        id: generate-github-token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.DUMMY_BOT_ID }}
          private_key: ${{ secrets.DUMMY_BOT_PRIVATE_ACCESS_KEY }}

      - name: Check for CloudFormation Asset
        id: check_cfstack_asset
        run: |
          # Check if cloudformation-build.zip exists in the release assets
          asset_exists=$(curl -s -H "Authorization: token ${{ steps.generate-github-token.outputs.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" \
            | jq -r '.assets[] | select(.name == "cloudformation-build.zip") | .name')
          
          if [ "$asset_exists" = "cloudformation-build.zip" ]; then
            echo "CloudFormation asset found, proceeding with deployment"
            echo "asset_found=true" >> $GITHUB_OUTPUT
          else
            echo "CloudFormation asset not found, skipping deployment"
            echo "asset_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Download asset
        if: steps.check_cfstack_asset.outputs.asset_found == 'true'
        uses: robinraju/release-downloader@v1.11
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.name }}
          fileName: cloudformation-build.zip
          token: ${{ steps.generate-github-token.outputs.token }}

      - name: Unzip Asset
        if: steps.check_cfstack_asset.outputs.asset_found == 'true'
        run: |
          set -euxo pipefail
          unzip -q cloudformation-build.zip && rm -rf cloudformation-build.zip

      - name: Make cfstack executable
        if: steps.check_cfstack_asset.outputs.asset_found == 'true'
        run: |
          set -euxo pipefail
          chmod +x ./cfstack

      - name: Deploy cfstack diff
        if: steps.check_cfstack_asset.outputs.asset_found == 'true'
        run: |
          set -euxo pipefail
          ./cfstack deploy --manifest diff.json --values values.json --role ${{ secrets.BUILD_AWS_CLOUDFORMATION_SERVICE_IAM_ROLE }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_AWS_SECRET_ACCESS_KEY }}