name: Build-Semaphore-Agent-Docker-Ecr

run-name: build-semaphore-agent-docker-${{ github.ref_name }}-${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      Region:
        description: "AWS Region"
        required: false
        default: "eu-west-1"
      AccountId:
        description: "AWS Account ID"
        required: false
        default: "254265454980"
      
  
jobs:
  build-default-semaphore-agent-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.Region }}
          aws-access-key-id: ${{ secrets.BUILD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BUILD_AWS_SECRET_ACCESS_KEY }}
         
      - name: Verify AWS credentials and permissions
        run: |
          echo "Testing AWS credentials..."
          aws sts get-caller-identity
          echo "Testing ECR permissions..."
          aws ecr describe-registry --region ${{ inputs.Region }}
          echo "AWS credentials and ECR permissions verified successfully!"

      - name: Create ECR repository if it doesn't exist
        run: |
          echo "Checking if ECR repository exists..."
          if aws ecr describe-repositories --repository-names semaphore-agent --region ${{ inputs.Region }} 2>/dev/null; then
            echo "Repository 'semaphore-agent' already exists"
          else
            echo "Creating repository 'semaphore-agent'..."
            aws ecr create-repository --repository-name semaphore-agent --region ${{ inputs.Region }}
            echo "Repository created successfully"
          fi

      - name: Get ECR login password
        id: ecr-password
        run: |
          echo "Getting ECR login password..."
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ inputs.Region }})
          if [ $? -eq 0 ]; then
            echo "::add-mask::$ECR_PASSWORD"
            echo "password=$ECR_PASSWORD" >> $GITHUB_OUTPUT
            echo "ECR password retrieved successfully"
          else
            echo "Failed to get ECR login password"
            exit 1
          fi

      - name: Login to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.AccountId }}.dkr.ecr.${{ inputs.Region }}.amazonaws.com
          username: AWS
          password: ${{ steps.ecr-password.outputs.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./semaphore-agent-docker
          push: true
          tags: ${{ inputs.AccountId }}.dkr.ecr.${{ inputs.Region }}.amazonaws.com/semaphore-agent:github-${{ github.ref_name }}-${{ github.run_number }}
          platforms: linux/amd64