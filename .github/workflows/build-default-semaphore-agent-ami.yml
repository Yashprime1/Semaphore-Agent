name: Build-Default-Semaphore-Agent-Ami

run-name: build-default-semaphore-agent-ami-${{ github.ref_name }}-${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      Region:
        description: "AWS Region"
        required: false
        default: "eu-west-1"

jobs:
  build-default-semaphore-agent-ami:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - AmiArch: "x86_64"
            AmiInstanceType: "t2.micro"

    steps:
      - name: Checkout agent-aws-stack repo
        uses: actions/checkout@v4
        with:
          repository: renderedtext/agent-aws-stack
          ref: v0.4.0
          show-progress: 'false'

      - name: Setup packer
        uses: hashicorp/setup-packer@v3.1.0
        with:
          version: 1.8.1

      - name: Update version to OS 24
        run: |
          # Debug: List files to see what's available
          echo "Current directory contents:"
          ls -la
          echo "Looking for ansible directory:"
          find . -name "ansible" -type d
          echo "Looking for ubuntu-focal.yml:"
          find . -name "ubuntu-focal.yml"
          
          # Update AMI filter to use Ubuntu Noble 24.04 instead of Focal 20.04
          find . -name "*.pkr.hcl" -o -name "*.json" | xargs sed -i 's/ubuntu-focal-20\.04/ubuntu-noble-24.04/g'
          
          # Create ubuntu-noble.yml playbook by copying ubuntu-focal.yml
          FOCAL_PLAYBOOK=$(find . -name "ubuntu-focal.yml" | head -1)
          if [ -n "$FOCAL_PLAYBOOK" ]; then
            NOBLE_PLAYBOOK=$(dirname "$FOCAL_PLAYBOOK")/ubuntu-noble.yml
            echo "Copying $FOCAL_PLAYBOOK to $NOBLE_PLAYBOOK"
            cp "$FOCAL_PLAYBOOK" "$NOBLE_PLAYBOOK"
            # Update the playbook name inside the file
            sed -i 's/Ubuntu Focal 20\.04/Ubuntu Noble 24.04/g' "$NOBLE_PLAYBOOK"
          else
            echo "ERROR: ubuntu-focal.yml not found!"
            exit 1
          fi
          
          # Update Packer HCL files to use the new playbook
          find . -name "*.pkr.hcl" | xargs sed -i 's/ubuntu-focal\.yml/ubuntu-noble.yml/g'

      - name: Initializing packer template
        run: |
          make packer.init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ inputs.Region }}

      - name: Building packer template
        run: |
          make packer.build.linux INSTALL_ERLANG=false AMI_INSTANCE_TYPE=${{ matrix.AmiInstanceType }} AMI_ARCH=${{ matrix.AmiArch }} AWS_REGION=${{ inputs.Region }} AMI_PREFIX=semaphore-agent-${{ github.run_id }} TOOLBOX_VERSION=v1.26.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ inputs.Region }}